name: Deploy Food Offers to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Crucial Food Deal Scrape Schedule (Sri Lanka IST = UTC+5:30):
    # - 00:30 UTC -> 06:00 AM IST : Daily menu & cache reset
    # - 02:15 UTC -> 07:45 AM IST : Breakfast & morning coffee deals
    # - 05:00 UTC -> 10:30 AM IST : Pre-lunch promos & noon combo drops
    # - 07:00 UTC -> 12:30 PM IST : Lunch peak rush flash discounts
    # - 09:30 UTC -> 03:00 PM IST : Teatime, bakery & afternoon snack specials
    # - 11:30 UTC -> 05:00 PM IST : Evening / dinner BOGO drops & happy hour promos
    # - 13:45 UTC -> 07:15 PM IST : Dinner peak rush vouchers & meal bundles
    # - 16:30 UTC -> 10:00 PM IST : Late-night craving & supper deals
    - cron: '30 0 * * *'
    - cron: '15 2 * * *'
    - cron: '0 5 * * *'
    - cron: '0 7 * * *'
    - cron: '30 9 * * *'
    - cron: '30 11 * * *'
    - cron: '45 13 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytest playwright pillow pytesseract
          playwright install chromium

      - name: Run Python unit tests
        run: |
          PYTHONPATH=. pytest

      - name: Run Python scrapers and update offers JSON
        run: |
          python scripts/update_offers.py

      - name: Commit and push updated offers data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/offers.json src/data/*_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated daily offer scrape [skip ci]" && git push)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
